name: Security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly: full scan suite
    - cron: "17 13 * * *"  # daily: production Headers live probe only
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ (github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1') }}
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan site and workflow code
        run: semgrep scan --config auto --error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: windwardline/windwardline/actions/secret-scan@942a00bd88baffc68a218020260ded794ae5c3d6 # v1.2.0

      # A step, not a job: the gate rides an already-required check, so no
      # ruleset change. Pinned by SHA like every other action — the gate that
      # enforces pinning is itself pinned; Dependabot carries version bumps.
      - uses: windwardline/windwardline/actions/verify-action-pins@942a00bd88baffc68a218020260ded794ae5c3d6 # v1.2.0

  headers-live:
    name: Headers live
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assert the seven security headers on production
        uses: windwardline/windwardline/actions/verify-live-headers@942a00bd88baffc68a218020260ded794ae5c3d6 # v1.2.0
        with:
          url: https://windwardline.com
